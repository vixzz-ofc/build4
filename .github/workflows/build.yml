name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      pat_token:
        description: "Token untuk download ZIP private"
        required: false
        default: ""

concurrency:
  group: flutter-build-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUB_CACHE: /opt/pub-cache
      GRADLE_USER_HOME: /opt/gradle-home
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FLUTTER_ROOT: /opt/flutter
      FLUTTER_CLI_ANALYTICS: "false"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_DISABLE_ANALYTICS: "true"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx2500m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dkotlin.incremental=false -Dkotlin.parallel.tasks.in.project=true -Dkapt.use.worker.api=true"
      JAVA_OPTS: "-Xmx2500m -XX:+UseParallelGC"

    steps:

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: /opt/pub-cache
          key: pub-global-linux-v7
          restore-keys: pub-global-linux-v7

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
          key: gradle-linux-v7
          restore-keys: gradle-linux-v7

      - name: Setup Flutter
        run: |
          if [ -d /opt/flutter ] && /opt/flutter/bin/flutter --version 2>/dev/null | grep -q "Flutter"; then
            echo "Flutter dari cache"
          else
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter 2>&1 | tail -3
          fi
          /opt/flutter/bin/flutter precache --android --no-ios --no-web 2>&1 | tail -3
          /opt/flutter/bin/flutter --version
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Download ZIP
        timeout-minutes: 4
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          INPUT_PAT_TOKEN: ${{ github.event.inputs.pat_token }}
          SECRET_PAT_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eo pipefail
          TOKEN="${INPUT_PAT_TOKEN:-${SECRET_PAT_TOKEN:-}}"
          download_zip() {
            if [ -n "$TOKEN" ]; then
              curl -fLsS -o /tmp/project.zip -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" --connect-timeout 15 --max-time 120 "$ZIP_URL"
            else
              curl -fLsS -o /tmp/project.zip -w "%{http_code}" -H "Accept: application/octet-stream" --connect-timeout 15 --max-time 120 "$ZIP_URL"
            fi
          }
          for i in $(seq 1 5); do
            HTTP_CODE=$(download_zip || echo "000")
            [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] && { echo "OK"; break; }
            rm -f /tmp/project.zip
            [ "$i" = "5" ] && { echo "GAGAL $HTTP_CODE"; exit 1; }
            sleep 5
          done
          file /tmp/project.zip | grep -qi "zip" || { echo "Bukan ZIP valid"; exit 1; }
          echo "ZIP $(du -sh /tmp/project.zip | cut -f1)"

      - name: Extract ZIP
        run: |
          set -eo pipefail
          mkdir -p project_raw
          unzip -q /tmp/project.zip -d project_raw
          rm -f /tmp/project.zip
          TOP_DIRS=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT=$(find project_raw -mindepth 1 -maxdepth 1 -type d | head -1)
          else
            ROOT="project_raw"
          fi
          echo "PROJECT_DIR=${ROOT%/}" >> $GITHUB_ENV
          echo "Extracted: ${ROOT%/}"

      - name: Fix Gradle + AGP + Kotlin
        run: |
          set -eo pipefail
          ANDROID_DIR="$PROJECT_DIR/android"
          [ ! -d "$ANDROID_DIR" ] && { echo "skip"; exit 0; }
          WRAPPER="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          [ -f "$WRAPPER" ] && sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.1-bin.zip|g' "$WRAPPER"
          for F in "$ANDROID_DIR/settings.gradle" "$ANDROID_DIR/settings.gradle.kts"; do
            [ ! -f "$F" ] && continue
            sed -i 's/\(id[[:space:]]*([[:space:]]*"com\.android\.application"[[:space:]]*)[[:space:]]*version[[:space:]]*\)"[0-9.]*"/\1"8.11.1"/g' "$F"
            sed -i 's/\(id[[:space:]]*([[:space:]]*"org\.jetbrains\.kotlin\.android"[[:space:]]*)[[:space:]]*version[[:space:]]*\)"[0-9.]*"/\1"2.2.20"/g' "$F"
          done
          for F in "$ANDROID_DIR/build.gradle" "$ANDROID_DIR/build.gradle.kts"; do
            [ ! -f "$F" ] && continue
            sed -i "s/classpath[[:space:]]*'com\.android\.tools\.build:gradle:[0-9.]*'/classpath 'com.android.tools.build:gradle:8.11.1'/g" "$F"
            sed -i 's/classpath[[:space:]]*"com\.android\.tools\.build:gradle:[0-9.]*"/classpath "com.android.tools.build:gradle:8.11.1"/g' "$F"
            sed -i "s/classpath[[:space:]]*'org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]*'/classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'/g" "$F"
            sed -i 's/classpath[[:space:]]*"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]*"/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"/g' "$F"
            sed -i 's/\(id[[:space:]]*([[:space:]]*"org\.jetbrains\.kotlin\.android"[[:space:]]*)[[:space:]]*version[[:space:]]*\)"[0-9.]*"/\1"2.2.20"/g' "$F"
          done
          for F in "$ANDROID_DIR/app/build.gradle" "$ANDROID_DIR/app/build.gradle.kts"; do
            [ ! -f "$F" ] && continue
            sed -i 's/\(id[[:space:]]*([[:space:]]*"org\.jetbrains\.kotlin\.android"[[:space:]]*)[[:space:]]*version[[:space:]]*\)"[0-9.]*"/\1"2.2.20"/g' "$F"
            sed -i "s/ext\.kotlin_version[[:space:]]*=[[:space:]]*'[0-9.]*'/ext.kotlin_version = '2.2.20'/g" "$F"
            sed -i 's/ext\.kotlin_version[[:space:]]*=[[:space:]]*"[0-9.]*"/ext.kotlin_version = "2.2.20"/g' "$F"
          done
          echo "Fix Gradle+AGP+Kotlin done"

      - name: Fix incompatible packages
        run: |
          set -eo pipefail
          PUBSPEC="$PROJECT_DIR/pubspec.yaml"
          [ ! -f "$PUBSPEC" ] && { echo "Bukan Flutter project, skip"; exit 0; }

          # Decode dan jalankan fix script via Node.js
          echo "" | base64 -d > /tmp/fix_packages.js
          node /tmp/fix_packages.js "$PROJECT_DIR"
          echo "Package fix done"

      - name: Flutter pub get
        timeout-minutes: 5
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          [ -d android ] && echo "sdk.dir=$ANDROID_HOME" > android/local.properties || true
          flutter pub get --no-precompile
          echo "pub get done"

      - name: Analyze
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos 2>&1 | tail -20

      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        timeout-minutes: 15
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          START=$(date +%s)
          cd "$PROJECT_DIR"
          [ -d android ] && echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --$BUILD_TYPE --no-pub --suppress-analytics --no-tree-shake-icons --target-platform android-arm64
          else
            GRADLE_PATH=$(find . -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" | head -1)
            [ -z "$GRADLE_PATH" ] && { echo "gradlew tidak ditemukan"; exit 1; }
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            chmod +x "$GRADLE_PATH"
            echo "sdk.dir=$ANDROID_HOME" > "$GRADLE_DIR/local.properties"
            [ ! -f "$GRADLE_DIR/gradle.properties" ] && touch "$GRADLE_DIR/gradle.properties"
            printf "\nkotlin.parallel.tasks.in.project=true\nkapt.use.worker.api=true\nandroid.enableR8.fullMode=false\n" >> "$GRADLE_DIR/gradle.properties"
            cd "$GRADLE_DIR"
            [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
            ./gradlew "$TASK" --no-daemon --parallel --build-cache --configure-on-demand --warning-mode=none -x test -x lint --console=plain
          fi
          echo "BUILD OK $(( $(date +%s) - START ))s"

      - name: Find APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find "$PROJECT_DIR/build" -name "*debug*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
          else
            APK=$(find "$PROJECT_DIR/build" -name "app-release.apk" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find "$PROJECT_DIR/build" -name "*release*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find "$PROJECT_DIR/build" -name "*release*.apk" 2>/dev/null | head -1)
          fi
          [ -z "$APK" ] && APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "APK tidak ditemukan"; exit 1; }
          APK_ABS=$(realpath "$APK")
          echo "APK: $(basename $APK_ABS) $(du -sh $APK_ABS | cut -f1)"
          echo "APK_ABS_PATH=$APK_ABS" >> $GITHUB_ENV

      - name: Press APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          set -eo pipefail
          APK_PATH="${{ env.APK_ABS_PATH }}"
          PRESSED_PATH="${APK_PATH%.apk}_pressed.apk"
          IS_SIGNED=$(node -e "const fs=require('fs');try{const fd=fs.openSync(process.argv[1],'r');const sz=fs.fstatSync(fd).size;const buf=Buffer.alloc(Math.min(65558,sz));fs.readSync(fd,buf,0,buf.length,sz-buf.length);fs.closeSync(fd);let off=-1;for(let i=buf.length-22;i>=0;i--){if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){off=i;break;}}if(off<0){process.stdout.write('false');process.exit(0);}const cd=buf.readUInt32LE(off+16);if(cd<24){process.stdout.write('false');process.exit(0);}const fd2=fs.openSync(process.argv[1],'r');const magic=Buffer.alloc(16);fs.readSync(fd2,magic,0,16,cd-16);fs.closeSync(fd2);process.stdout.write(magic.toString('utf8')==='APK Sig Block 42'?'true':'false');}catch(e){process.stdout.write('false');}" "$APK_PATH")
          if [ "$IS_SIGNED" = "true" ]; then
            echo "APK signed skip press"
            echo "APK_ABS_PATH=$APK_PATH" >> $GITHUB_ENV
            exit 0
          fi
          echo "" | base64 -d > /tmp/press_apk.js
          node /tmp/press_apk.js "$APK_PATH" "$PRESSED_PATH"
          if [ -f "$PRESSED_PATH" ] && [ -s "$PRESSED_PATH" ]; then
            echo "APK_ABS_PATH=$PRESSED_PATH" >> $GITHUB_ENV
            echo "Pressed $(basename $PRESSED_PATH) $(du -sh $PRESSED_PATH | cut -f1)"
          else
            echo "Press gagal pakai original"
            echo "APK_ABS_PATH=$APK_PATH" >> $GITHUB_ENV
          fi

      - name: Upload APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
